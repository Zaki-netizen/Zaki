
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVLADOR AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 { color: #00ff88; }
.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.logo img {
  width: 35px;
  height: 35px;
  object-fit: contain;
  filter: brightness(0) saturate(100%) invert(69%) sepia(99%) saturate(500%) hue-rotate(100deg);
}
    #previewTeam,
#previewPlayer {
  border: 2px solid #00ff88;
  box-shadow: 0 0 12px #00ff88;
  padding: 4px;
  background: #111;
  display: block;
    }
    .box {
  background:
    linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.65)),
    url("https://raw.githubusercontent.com/Zaki-netizen/Zaki/main/file_0000000011b881f58598fc9bf83a01e3.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border: 2px solid #00ff88;
  border-radius: 18px;
  padding: 20px;
  margin: 25px 0;
  box-shadow: 0 0 15px rgba(0, 255, 136, 0.25);
} 

    input[type="file"] {
  display: block;
  width: 100%;
  margin: 20px 0;
  padding: 15px;
  background: #151d18;
  border: 2px solid #00ff88;
  border-radius: 12px;
  color: white;
  font-size: 17px;
  font-weight: bold;
  box-sizing: border-box;
}

input[type="file"]::file-selector-button {
  background: #00ff88;
  color: #111;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
  margin-left: 12px;
  cursor: pointer;
}

    button {
      background: #00ff88;
      color: #111;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
      margin: 8px;
    }

    .result {
      margin-top: 25px;
      text-align: right;
      white-space: pre-wrap;
      line-height: 1.8;
    }

    h2 { color: #00ff88; }
    body {
  background: #080d0a;
}

body::before {
  content: "";
  position: fixed;
  inset: -50%;
  z-index: 0;
  pointer-events: none;
  opacity: 0.55;
  background-image:
    radial-gradient(circle, #00ff88 1px, transparent 2px),
    radial-gradient(circle, #00cc66 2px, transparent 3px),
    radial-gradient(circle, #ffffff 1px, transparent 2px);
  background-size: 75px 75px, 130px 130px, 180px 180px;
  animation: greenParticles 25s linear infinite;
}

body > * {
  position: relative;
  z-index: 1;
}

@keyframes greenParticles {
  from {
    transform: translate(0, 0);
  }
  to {
    transform: translate(-100px, -150px);
  }
    }
  </style>
</head>

<body>

  <h1 class="logo">
  <img src="https://cdn-icons-png.flaticon.com/512/53/53283.png" alt="Football">
  EVLADOR AI
  </h1>
  <p>مساعدك الذكي في eFootball 2026</p>

  <div class="box">
    <h2>📋 تحليل التشكيلات</h2>
    <p>ارفع صورة تشكيلتك للحصول على تحليل تكتيكي.</p>

    <input type="file" id="imageInput" accept="image/*">
<img id="previewTeam" style="display:none; width:180px; max-width:100%; border-radius:12px; margin:10px auto;">
    <button onclick="analyzeImage()">حلل التشكيلة ⚽</button>

    <div id="result" class="result"></div>
  </div>

  <div class="box">
    <h2>🔥 تطوير اللاعبين</h2>
    <p>ارفع صورة بطاقة اللاعب للحصول على اقتراح تطوير مناسب.</p>

    <input type="file" id="playerInput" accept="image/*">
<img id="previewPlayer" style="display:none; width:180px; max-width:100%; border-radius:12px; margin:10px auto;">
    <button onclick="developPlayer()">حلل تطويرة اللاعب 🚀</button>

    <div id="playerResult" class="result"></div>
  </div>

  <script>
    function showPreview(inputId, previewId) {
  const input = document.getElementById(inputId);
  const preview = document.getElementById(previewId);

  input.addEventListener("change", function() {
    const file = input.files[0];

    if (!file) {
      preview.style.display = "none";
      return;
    }

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  });
}

showPreview("imageInput", "previewTeam");
showPreview("playerInput", "previewPlayer");
    async function sendImage(inputId, resultId, endpoint, loadingText) {
      const input = document.getElementById(inputId);
      const result = document.getElementById(resultId);

      if (!input.files[0]) {
        result.textContent = "⚠️ يرجى اختيار صورة أولاً.";
        return;
      }

      if (input.files[0].size > 12 * 1024 * 1024) {
        result.textContent = "⚠️ الصورة كبيرة جداً. اختر صورة أصغر من 12MB.";
        return;
      }

      result.textContent = loadingText;

      const reader = new FileReader();

      reader.onload = async function() {
        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              image: reader.result
            })
          });

          const data = await response.json();

          if (!response.ok) {
            result.textContent = data.error || "حدث خطأ أثناء التحليل.";
            return;
          }

          result.textContent = data.result || "لم تصل نتيجة التحليل.";
        } catch (error) {
          result.textContent = "تعذر الاتصال بالخادم.";
        }
      };

      reader.onerror = function() {
        result.textContent = "تعذرت قراءة الصورة.";
      };

      reader.readAsDataURL(input.files[0]);
    }

    function analyzeImage() {
      sendImage(
        "imageInput",
        "result",
        "/analyze",
        "⏳ جاري تحليل التشكيلة..."
      );
    }

    function developPlayer() {
      sendImage(
        "playerInput",
        "playerResult",
        "/develop",
        "⏳ جاري تحليل اللاعب واقتراح أفضل تطويرة..."
      );
    }
  </script>

</body>
</html>
