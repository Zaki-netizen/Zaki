<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVLADOR - محلل التشكيلات</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #00ff88;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: #222;
      padding: 20px;
      border-radius: 15px;
    }

    input {
      margin: 20px 0;
      width: 100%;
    }

    button {
      background: #00ff88;
      color: #111;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      text-align: right;
      white-space: pre-wrap;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <h1>⚽ EVLADOR</h1>
  <p>ارفع صورة تشكيلتك واحصل على تحليل بالذكاء الاصطناعي</p>

  <div class="box">
    <input type="file" id="imageInput" accept="image/*">

    <br>

    <button onclick="analyzeImage()">حلل التشكيلة ⚽</button>

    <div id="result"></div>
  </div>

  <script>
    async function analyzeImage() {
      const input = document.getElementById("imageInput");
      const result = document.getElementById("result");

      if (!input.files[0]) {
        result.textContent = "⚠️ يرجى اختيار صورة أولاً.";
        return;
      }

      result.textContent = "⏳ جاري تحليل التشكيلة...";

      const reader = new FileReader();

      reader.onload = async function() {
        try {
          const response = await fetch("/analyze", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              image: reader.result
            })
          });

          const data = await response.json();

          if (data.result) {
            result.textContent = data.result;
          } else {
            result.textContent = "حدث خطأ أثناء التحليل.";
          }
        } catch (error) {
          result.textContent = "تعذر الاتصال بالخادم.";
        }
      };

      reader.readAsDataURL(input.files[0]);
    }
  </script>

</body>
</html>
